plugins {
    id 'fabric-loom' version "${loom_version}"
}

group = 'dev.btstudio'
version = project.mod_version
base { archivesName = 'minecraft-skins-fabric' }

// Minecraft 1.20.2 introduced the SkinTextures record; compile only the matching adapter.
def skinApi = project.findProperty('skin_api') ?: 'legacy'
if (!(skinApi in ['legacy', 'modern', 'asset'])) throw new GradleException('Unknown skin_api: ' + skinApi)
sourceSets.main.java.srcDir "src/mc-${skinApi}/java"
def identifierApi = project.findProperty('identifier_api') ?: 'legacy'
if (!(identifierApi in ['legacy', 'factory'])) throw new GradleException('Unknown identifier_api: ' + identifierApi)
sourceSets.main.java.srcDir "src/id-${identifierApi}/java"
def textureApi = project.findProperty('texture_api') ?: 'legacy'
if (!(textureApi in ['legacy', 'named'])) throw new GradleException('Unknown texture_api: ' + textureApi)
sourceSets.main.java.srcDir "src/texture-${textureApi}/java"

repositories { mavenCentral() }

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}

processResources {
    inputs.property 'version', project.version
    inputs.property 'minecraft_version', project.minecraft_version
    inputs.property 'loader_version', project.loader_version
    inputs.property 'java_version', project.java_version
    filesMatching('fabric.mod.json') {
        expand version: project.version, minecraft_version: project.minecraft_version, loader_version: project.loader_version, java_version: project.java_version
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = project.java_version.toInteger()
}

tasks.named('remapJar') { archiveFileName = "minecraft-skins-fabric-${project.minecraft_version}.jar" }
