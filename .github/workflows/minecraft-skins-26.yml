name: Build Minecraft Skins JAR for 26.x
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'minecraft-skins-fabric-26/**'
      - '.github/workflows/minecraft-skins-26.yml'
  push:
    paths:
      - 'minecraft-skins-fabric-26/**'
      - '.github/workflows/minecraft-skins-26.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - minecraft: '26.1'
            fabric: '0.145.1+26.1'
          - minecraft: '26.1.1'
            fabric: '0.145.4+26.1.1'
          - minecraft: '26.1.2'
            fabric: '0.155.3+26.1.2'
          - minecraft: '26.2'
            fabric: '0.161.0+26.2'
          - minecraft: '26.3'
            fabric: '0.166.2+26.3'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.8.2'
      - name: Build the unobfuscated Fabric mod
        working-directory: minecraft-skins-fabric-26
        shell: bash
        run: |
          set +e
          gradle build --no-daemon -Pminecraft_version='${{ matrix.minecraft }}' -Pfabric_version='${{ matrix.fabric }}' > "$RUNNER_TEMP/minecraft-skins-26-build.log" 2>&1
          result=$?
          cat "$RUNNER_TEMP/minecraft-skins-26-build.log"
          if [ "$result" -ne 0 ]; then
            python3 - "$RUNNER_TEMP/minecraft-skins-26-build.log" <<'PY'
          import sys
          lines = open(sys.argv[1], errors='replace').read().splitlines()
          interesting = [line for line in lines if 'error:' in line or line.startswith('* What went wrong:') or line.startswith('> ')]
          for line in interesting[:20]:
              print('::error::' + line.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A'))
          PY
            exit "$result"
          fi
      - name: Check the built JAR metadata
        run: |
          python3 - '${{ matrix.minecraft }}' <<'PY'
          import json, sys, zipfile
          version = sys.argv[1]
          path = f'minecraft-skins-fabric-26/build/libs/minecraft-skins-fabric-{version}.jar'
          with zipfile.ZipFile(path) as jar:
              assert jar.testzip() is None
              meta = json.loads(jar.read('fabric.mod.json'))
              assert meta['id'] == 'fmf_skins'
              assert meta['depends']['minecraft'] == '=' + version
              assert meta['depends']['java'] == '>=25'
              assert any(name.endswith('MinecraftSkinsClient.class') for name in jar.namelist())
              assert any(name.endswith('LocalPlayerSkinMixin.class') for name in jar.namelist())
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: minecraft-skins-fabric-${{ matrix.minecraft }}
          path: minecraft-skins-fabric-26/build/libs/minecraft-skins-fabric-${{ matrix.minecraft }}.jar
          if-no-files-found: error
          retention-days: 7
