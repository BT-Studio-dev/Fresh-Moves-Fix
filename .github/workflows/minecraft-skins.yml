name: Build Minecraft Skins JAR
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'minecraft-skins-fabric/**'
      - '.github/workflows/minecraft-skins.yml'
  push:
    paths:
      - 'minecraft-skins-fabric/**'
      - '.github/workflows/minecraft-skins.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - minecraft: '1.20'
            yarn: '1.20+build.1'
            fabric: '0.83.0+1.20'
            skin_api: 'legacy'
          - minecraft: '1.20.1'
            yarn: '1.20.1+build.10'
            fabric: '0.92.6+1.20.1'
            skin_api: 'legacy'
          - minecraft: '1.20.2'
            yarn: '1.20.2+build.4'
            fabric: '0.91.6+1.20.2'
            skin_api: 'modern'
          - minecraft: '1.20.3'
            yarn: '1.20.3+build.1'
            fabric: '0.91.1+1.20.3'
            skin_api: 'modern'
          - minecraft: '1.20.4'
            yarn: '1.20.4+build.3'
            fabric: '0.97.3+1.20.4'
            skin_api: 'modern'
          - minecraft: '1.20.5'
            yarn: '1.20.5+build.1'
            fabric: '0.97.8+1.20.5'
            skin_api: 'modern'
            java: '21'
            gradle: '8.7'
            loom: '1.6.12'
          - minecraft: '1.20.6'
            yarn: '1.20.6+build.3'
            fabric: '0.100.8+1.20.6'
            skin_api: 'modern'
            java: '21'
            gradle: '8.7'
            loom: '1.6.12'
          - minecraft: '1.21'
            yarn: '1.21+build.9'
            fabric: '0.102.0+1.21'
            skin_api: 'modern'
            identifier_api: 'factory'
            java: '21'
            gradle: '8.8'
            loom: '1.7.4'
          - minecraft: '1.21.1'
            yarn: '1.21.1+build.3'
            fabric: '0.102.1+1.21.1'
            skin_api: 'modern'
            identifier_api: 'factory'
            java: '21'
            gradle: '8.8'
            loom: '1.7.4'
          - minecraft: '1.21.2'
            yarn: '1.21.2+build.1'
            fabric: '0.106.1+1.21.2'
            skin_api: 'modern'
            identifier_api: 'factory'
            java: '21'
            gradle: '8.12'
            loom: '1.9.2'
          - minecraft: '1.21.3'
            yarn: '1.21.3+build.2'
            fabric: '0.114.1+1.21.3'
            skin_api: 'modern'
            identifier_api: 'factory'
            java: '21'
            gradle: '8.12'
            loom: '1.9.2'
          - minecraft: '1.21.4'
            yarn: '1.21.4+build.8'
            fabric: '0.119.4+1.21.4'
            skin_api: 'modern'
            identifier_api: 'factory'
            java: '21'
            gradle: '8.12'
            loom: '1.9.2'
          - minecraft: '1.21.5'
            yarn: '1.21.5+build.1'
            fabric: '0.128.2+1.21.5'
            skin_api: 'modern'
            identifier_api: 'factory'
            texture_api: 'named'
            java: '21'
            gradle: '8.14'
            loom: '1.11.8'
          - minecraft: '1.21.6'
            yarn: '1.21.6+build.1'
            fabric: '0.128.2+1.21.6'
            skin_api: 'modern'
            identifier_api: 'factory'
            texture_api: 'named'
            java: '21'
            gradle: '8.14'
            loom: '1.11.8'
          - minecraft: '1.21.7'
            yarn: '1.21.7+build.8'
            fabric: '0.129.0+1.21.7'
            skin_api: 'modern'
            identifier_api: 'factory'
            texture_api: 'named'
            java: '21'
            gradle: '8.14'
            loom: '1.11.8'
          - minecraft: '1.21.8'
            yarn: '1.21.8+build.1'
            fabric: '0.136.1+1.21.8'
            skin_api: 'modern'
            identifier_api: 'factory'
            texture_api: 'named'
            java: '21'
            gradle: '8.14'
            loom: '1.11.8'
          - minecraft: '1.21.9'
            yarn: '1.21.9+build.1'
            fabric: '0.134.1+1.21.9'
            skin_api: 'asset'
            identifier_api: 'factory'
            texture_api: 'named'
            loader: '0.18.4'
            java: '21'
            gradle: '9.2.1'
            loom: '1.14-SNAPSHOT'
          - minecraft: '1.21.10'
            yarn: '1.21.10+build.3'
            fabric: '0.138.4+1.21.10'
            skin_api: 'asset'
            identifier_api: 'factory'
            texture_api: 'named'
            loader: '0.18.4'
            java: '21'
            gradle: '9.2.1'
            loom: '1.14-SNAPSHOT'
          - minecraft: '1.21.11'
            yarn: '1.21.11+build.4'
            fabric: '0.141.6+1.21.11'
            skin_api: 'asset'
            identifier_api: 'factory'
            texture_api: 'named'
            loader: '0.18.4'
            java: '21'
            gradle: '9.2.1'
            loom: '1.14-SNAPSHOT'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java || '17' }}
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ matrix.gradle || '8.5' }}
      - name: Compile and remap the Fabric mod
        working-directory: minecraft-skins-fabric
        shell: bash
        run: |
          set +e
          gradle build --no-daemon -Pminecraft_version='${{ matrix.minecraft }}' -Pyarn_mappings='${{ matrix.yarn }}' -Pfabric_version='${{ matrix.fabric }}' -Ploader_version='${{ matrix.loader || '0.16.12' }}' -Pskin_api='${{ matrix.skin_api }}' -Pidentifier_api='${{ matrix.identifier_api || 'legacy' }}' -Ptexture_api='${{ matrix.texture_api || 'legacy' }}' -Ploom_version='${{ matrix.loom || '1.3.8' }}' -Pjava_version='${{ matrix.java || '17' }}' > "$RUNNER_TEMP/minecraft-skins-build.log" 2>&1
          result=$?
          cat "$RUNNER_TEMP/minecraft-skins-build.log"
          if [ "$result" -ne 0 ]; then
            python3 - "$RUNNER_TEMP/minecraft-skins-build.log" <<'PY'
          import sys
          lines = open(sys.argv[1], errors='replace').read().splitlines()
          interesting = [line for line in lines if 'error:' in line or line.startswith('* What went wrong:') or line.startswith('> ')]
          for line in interesting[:15]:
              print('::error::' + line.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A'))
          PY
            exit "$result"
          fi
      - name: Check the built JAR metadata
        run: |
          python3 - '${{ matrix.minecraft }}' '${{ matrix.java || '17' }}' <<'PY'
          import json, sys, zipfile
          version, java_version = sys.argv[1:]
          path = f'minecraft-skins-fabric/build/libs/minecraft-skins-fabric-{version}.jar'
          with zipfile.ZipFile(path) as jar:
              assert jar.testzip() is None
              meta = json.loads(jar.read('fabric.mod.json'))
              assert meta['id'] == 'fmf_skins'
              assert meta['depends']['minecraft'] == '=' + version
              assert meta['depends']['java'] == '>=' + java_version
              assert json.loads(jar.read('fmfskins.mixins.json'))['compatibilityLevel'] == 'JAVA_' + java_version
              assert any(name.endswith('MinecraftSkinsClient.class') for name in jar.namelist())
              assert any(name.endswith('LocalPlayerSkinMixin.class') for name in jar.namelist())
          print('Verified mod metadata and classes in', path)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: minecraft-skins-fabric-${{ matrix.minecraft }}
          path: minecraft-skins-fabric/build/libs/minecraft-skins-fabric-${{ matrix.minecraft }}.jar
          if-no-files-found: error
          retention-days: 7
