name: Build Herobrine mod
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'herobrine-mod/**'
      - '.github/workflows/herobrine.yml'
  push:
    branches: [main]
    paths:
      - 'herobrine-mod/**'
      - '.github/workflows/herobrine.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.8.2'
      - name: Build
        working-directory: herobrine-mod
        run: gradle build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: herobrine-watcher-fabric-26.3
          path: herobrine-mod/build/libs/*.jar
          if-no-files-found: error
