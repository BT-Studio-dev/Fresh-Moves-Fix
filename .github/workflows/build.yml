name: Build pack

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Check and zip the pack
        run: python3 build.py
      - uses: actions/upload-artifact@v4
        with:
          name: Fresh-Moves-Fix
          path: dist/*.zip
      - name: Publish release
        # on main, when started by hand (Actions > Build pack > Run workflow), or when the commit message contains [release]
        if: (github.ref == 'refs/heads/main' && github.event_name != 'pull_request') || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[release]'))
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          TAG="v$VERSION"
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/*.zip --clobber
          else
            gh release create "$TAG" dist/*.zip \
              --target "$GITHUB_SHA" \
              --title "Fresh Moves Fix $VERSION" \
              --latest \
              --notes-file .github/release-notes.md
          fi
