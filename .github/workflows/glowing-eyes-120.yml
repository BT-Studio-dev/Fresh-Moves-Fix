name: Build experimental Glowing Eyes 1.20.x
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'glowing-eyes-fabric-120/**'
      - '.github/workflows/glowing-eyes-120.yml'
  push:
    paths:
      - 'glowing-eyes-fabric-120/**'
      - '.github/workflows/glowing-eyes-120.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - minecraft: '1.20.5'
            fabric: '0.97.8+1.20.5'
          - minecraft: '1.20.6'
            fabric: '0.100.8+1.20.6'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12.1'
      - name: Build experimental Fabric backport
        working-directory: glowing-eyes-fabric-120
        shell: bash
        env:
          MC_VERSION: ${{ matrix.minecraft }}
          FABRIC_VERSION: ${{ matrix.fabric }}
        run: |
          set +e
          # Retry only HTTP 429 rate limits; real build errors remain failures.
          for attempt in 1 2 3; do
            gradle build --no-daemon -Pminecraft_version="$MC_VERSION" -Pfabric_version="$FABRIC_VERSION" > "$RUNNER_TEMP/glow120.log" 2>&1
            result=$?
            cat "$RUNNER_TEMP/glow120.log"
            if [ "$result" -eq 0 ] || ! grep -q 'Received status code 429' "$RUNNER_TEMP/glow120.log" || [ "$attempt" -eq 3 ]; then
              break
            fi
            echo "Dependency server rate-limited attempt $attempt; retrying."
            sleep $((attempt * 20))
          done
          if [ "$result" -ne 0 ]; then
            python3 - "$RUNNER_TEMP/glow120.log" <<'PY'
          import sys
          lines = open(sys.argv[1], errors='replace').read().splitlines()
          selected = []
          for i, line in enumerate(lines):
              if 'error:' in line or line.startswith('* What went wrong:'):
                  selected.append('\n'.join(lines[i:i+15]))
          detail = '\n---\n'.join(selected[:60]) or '\n'.join(lines[-40:])
          print('::error::' + detail[:60000].replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A'))
          PY
            exit "$result"
          fi
      - name: Check artifact metadata
        env:
          MC_VERSION: ${{ matrix.minecraft }}
        run: |
          python3 - <<'PY'
          import json, os, zipfile
          version = os.environ['MC_VERSION']
          path = f'glowing-eyes-fabric-120/build/libs/glowing-eyes-fmf-fabric-{version}-experimental.jar'
          with zipfile.ZipFile(path) as jar:
              assert jar.testzip() is None
              meta = json.loads(jar.read('fabric.mod.json'))
              assert meta['id'] == 'glowingeyes'
              assert meta['depends']['minecraft'] == '=' + version
              assert meta['depends']['java'] == '>=21'
              assert 'experimental' in meta['name'].lower()
              assert 'NOTICE.md' in jar.namelist()
              assert any(x.endswith('GlowingEyesClient.class') for x in jar.namelist())
          PY
      - name: Export build bytes for direct-site packaging
        if: github.event_name == 'push'
        env:
          MC_VERSION: ${{ matrix.minecraft }}
        run: |
          python3 - <<'PY'
          import base64, os, pathlib
          version = os.environ['MC_VERSION']
          jar = pathlib.Path(f'glowing-eyes-120/build/libs/glowing-eyes-fmf-fabric-{version}-experimental.jar')
          data = base64.b64encode(jar.read_bytes()).decode()
          parts = [data[i:i+58000] for i in range(0, len(data), 58000)]
          if len(parts) > 10:
              raise SystemExit(f'JAR too large for annotation export: {len(parts)} parts')
          for index, part in enumerate(parts):
              print(f'::notice title=jar-fabric-{version}-{index+1}-of-{len(parts)}::{part}')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: glowing-eyes-fmf-fabric-${{ matrix.minecraft }}-experimental
          path: glowing-eyes-fabric-120/build/libs/glowing-eyes-fmf-fabric-${{ matrix.minecraft }}-experimental.jar
          if-no-files-found: error
          retention-days: 7
