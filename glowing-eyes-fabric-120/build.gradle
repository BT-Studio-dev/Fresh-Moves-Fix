plugins {
    id 'fabric-loom' version '1.10-SNAPSHOT'
}
group = 'dev.btstudio.glowingeyes'
version = "2.1.3-fmf.${project.minecraft_version}-alpha.1"
base { archivesName = "glowing-eyes-fmf-fabric-${project.minecraft_version}" }
repositories {
    maven { name = 'Ladysnake'; url = 'https://maven.ladysnake.org/releases' }
    mavenCentral()
}
dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    include modImplementation("org.ladysnake.cardinal-components-api:cardinal-components-base:${project.cca_version}")
    include modImplementation("org.ladysnake.cardinal-components-api:cardinal-components-entity:${project.cca_version}")
}
loom {
    accessWidenerPath = file('src/main/resources/glowingeyes.accesswidener')
    mixin { defaultRefmapName = 'glowingeyes.refmap.json' }
}
processResources {
    inputs.properties(version: project.version, minecraft_version: project.minecraft_version,
        loader_version: project.loader_version, fabric_version: project.fabric_version)
    filesMatching(['fabric.mod.json', '*.mixins.json', 'pack.mcmeta']) {
        expand version: project.version, minecraft_version: project.minecraft_version,
            loader_version: project.loader_version, fabric_version: project.fabric_version,
            mod_id: 'glowingeyes', mod_name: 'Glowing Eyes (FMF experimental port)',
            description: 'Unofficial experimental Fresh Moves Fix port of Glowing Eyes.',
            license: 'LGPL-3.0-or-later', java_version: '21'
    }
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8'; options.release = 21 }
tasks.named('jar') { from('LICENSE') { rename { 'LICENSE_GlowingEyes' } }; from('NOTICE.md') }
tasks.named('remapJar') { archiveFileName = "glowing-eyes-fmf-fabric-${project.minecraft_version}-experimental.jar" }
