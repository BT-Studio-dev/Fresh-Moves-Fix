plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

group = 'dev.btstudio'
version = project.mod_version
base { archivesName = 'minecraft-skins-fabric' }

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}

processResources {
    inputs.property 'version', project.version
    inputs.property 'minecraft_version', project.minecraft_version
    inputs.property 'loader_version', project.loader_version
    inputs.property 'java_version', project.java_version
    filesMatching('fabric.mod.json') {
        expand version: project.version, minecraft_version: project.minecraft_version, loader_version: project.loader_version, java_version: project.java_version
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = project.java_version.toInteger()
}

tasks.named('jar') { archiveFileName = "minecraft-skins-fabric-${project.minecraft_version}.jar" }
